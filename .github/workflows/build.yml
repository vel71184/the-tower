name: Test and build

on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

permissions:
  contents: write  # only used to publish screenshots to the ci-screenshots branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tpl/"
          rm -f godot.zip templates.tpz
          godot --version

      - name: Configure Android export
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          minor="${GODOT_VERSION%.*}"
          for f in editor_settings-4.tres "editor_settings-${minor}.tres"; do
            cat > ~/.config/godot/$f <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          CFG
          done

      - name: Import project
        run: godot --headless --path . --import 2>&1 | tee import.log

      - name: Run tests
        run: |
          set -o pipefail
          # A script error can stop the runner before it quits, so cap it.
          timeout 300 godot --headless --path . res://tests/test_runner.tscn 2>&1 | tee test.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|FAIL |ERROR:" test.log; then
            echo "::error::Script errors or failed checks in test output"
            exit 1
          fi

      - name: Screenshots
        continue-on-error: true
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers > /dev/null
          mkdir -p build/shots
          SHOT_DIR="$PWD/build/shots" timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --rendering-driver vulkan --resolution 1280x720 res://tests/screenshots.tscn 2>&1 | tail -20
          ls -la build/shots

      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push' && hashFiles('build/shots/*.png') != ''
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp -r build/shots /tmp/shots && cd /tmp/shots
          printf "# CI screenshots\n\nFrom %s on %s, run %s.\nReplaced on every push; history is not kept.\n" \
            "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screenshots

      - name: Export Android (debug APK)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/the-tower.apk 2>&1 | tee android.log
          test -s build/android/the-tower.apk

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows" build/windows/TheTower.exe
          test -s build/windows/TheTower.exe

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux" build/linux/TheTower.x86_64
          test -s build/linux/TheTower.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/shots/

      - uses: actions/upload-artifact@v4
        with:
          name: the-tower-android-apk
          path: build/android/the-tower.apk

      - uses: actions/upload-artifact@v4
        with:
          name: the-tower-windows
          path: build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: the-tower-linux
          path: build/linux/
